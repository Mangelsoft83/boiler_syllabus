<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Illustrative furnace temperature profile</title>
<desc id="desc">Along the flue-gas path after the flame zone, gas cools from 1600 degrees Celsius to a furnace exit temperature of 927 degrees Celsius. Outer and inner tube walls remain above boiling water at 300 degrees Celsius. A dashed reference marks the furnace exit temperature used as the hot-side input in the lumped calculation.</desc>
