<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Gas fuel: fuel valves and combustion-air fan</title><desc id="desc">Gas fuel passes through isolation and control valves to the burner. A separate fan and damper supply combustion air.</desc>
