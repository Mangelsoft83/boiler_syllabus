<text x="640" y="248" text-anchor="middle" font-size="16" fill="#182333">valve</text>
<text x="776" y="158" text-anchor="middle" font-size="17" fill="#794aac">Liquid fuel</text>
<text x="610" y="291" text-anchor="middle" font-size="15" fill="#182333">Atomizing medium may be required by the burner.</text>
<text x="78" y="369" text-anchor="middle" font-size="17" fill="#182333">Air inlet</text>
<path d="M130 360H250" fill="none" stroke="#326bc1" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="280" cy="360" r="30" fill="#e8f2ff" stroke="#326bc1" stroke-width="3"/><path d="M267 342L301 360L267 378Z" fill="#326bc1"/>
<text x="280" y="309" text-anchor="middle" font-size="17" fill="#182333">Air fan</text>
<path d="M310 360H875" fill="none" stroke="#326bc1" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M584 346L616 374V346L584 374Z" fill="white" stroke="#326bc1" stroke-width="3"/><path d="M600 359V330M590 330H610" stroke="#326bc1" stroke-width="2"/>
<text x="600" y="406" text-anchor="middle" font-size="16" fill="#182333">Air damper</text>
<text x="755" y="338" text-anchor="middle" font-size="17" fill="#326bc1">Combustion air</text>
<text x="600" y="469" text-anchor="middle" font-size="18" fill="#182333">Fuel flow × fuel parameters → heat input and fuel-derived products.</text>
<text x="600" y="505" text-anchor="middle" font-size="16" fill="#182333">The fan moves combustion air; the valves regulate the separate fuel stream.</text>
<text x="600" y="536" text-anchor="middle" font-size="15" fill="#61748b">Conceptual flow diagram; valve trains and auxiliaries are simplified.</text>
