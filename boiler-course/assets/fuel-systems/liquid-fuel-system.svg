<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Liquid fuel: fuel valves and combustion-air fan</title><desc id="desc">Liquid fuel passes through isolation and control valves to the burner. A separate fan and damper supply combustion air.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1200" height="560" fill="#fff"/><g font-family="Arial, sans-serif" fill="#182333">
<text x="600" y="36" text-anchor="middle" font-size="25" fill="#182333">Liquid fuel: fuel valves and combustion-air fan</text>
<rect x="885" y="125" width="110" height="270" rx="10" fill="#fff0df" stroke="#61748b" stroke-width="2"/>
<text x="940.0" y="266.0" text-anchor="middle" font-size="17" fill="#182333">Burner</text>
<rect x="1035" y="125" width="130" height="270" rx="10" fill="#fff6e9" stroke="#61748b" stroke-width="2"/>
<text x="1100.0" y="266.0" text-anchor="middle" font-size="17" fill="#182333">Furnace</text>
