<rect x="25" y="145" width="125" height="70" rx="10" fill="#f2eafa" stroke="#61748b" stroke-width="2"/>
<text x="87.5" y="186.0" text-anchor="middle" font-size="17" fill="#182333">Fuel tank</text>
<path d="M150 180H875" fill="none" stroke="#794aac" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="190" y="151" width="95" height="58" rx="10" fill="#f2eafa" stroke="#61748b" stroke-width="2"/>
<text x="237.5" y="186.0" text-anchor="middle" font-size="17" fill="#182333">Pump</text>
<path d="M394 166L426 194V166L394 194Z" fill="white" stroke="#794aac" stroke-width="3"/><path d="M410 179V150M400 150H420" stroke="#794aac" stroke-width="2"/>
<text x="410" y="226" text-anchor="middle" font-size="16" fill="#182333">Isolation</text>
<text x="410" y="248" text-anchor="middle" font-size="16" fill="#182333">valve</text>
<path d="M624 166L656 194V166L624 194Z" fill="white" stroke="#794aac" stroke-width="3"/><path d="M640 179V150M630 150H650" stroke="#794aac" stroke-width="2"/>
