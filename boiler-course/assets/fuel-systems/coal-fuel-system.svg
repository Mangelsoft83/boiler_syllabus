<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Coal: feeder, mill, primary-air fan and combustion-air fan</title><desc id="desc">Coal goes through a feeder and mill. Primary air dries and transports pulverized coal to the burner. A separate secondary-air fan supplies combustion air.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1200" height="560" fill="#fff"/><g font-family="Arial, sans-serif" fill="#182333">
<text x="600" y="36" text-anchor="middle" font-size="25" fill="#182333">Coal: feeder, mill, primary-air fan and combustion-air fan</text>
<rect x="885" y="125" width="110" height="270" rx="10" fill="#fff0df" stroke="#61748b" stroke-width="2"/>
<text x="940.0" y="266.0" text-anchor="middle" font-size="17" fill="#182333">Burner</text>
<rect x="1035" y="125" width="130" height="270" rx="10" fill="#fff6e9" stroke="#61748b" stroke-width="2"/>
<text x="1100.0" y="266.0" text-anchor="middle" font-size="17" fill="#182333">Furnace</text>
<path d="M995 255H1027" fill="none" stroke="#dd7623" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="25" y="98" width="130" height="65" rx="10" fill="#efefef" stroke="#61748b" stroke-width="2"/>
<text x="90.0" y="136.5" text-anchor="middle" font-size="17" fill="#182333">Coal bunker</text>
<path d="M155 130H215" fill="none" stroke="#575b63" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="225" y="98" width="110" height="65" rx="10" fill="#efefef" stroke="#61748b" stroke-width="2"/>
<text x="280.0" y="136.5" text-anchor="middle" font-size="17" fill="#182333">Feeder</text>
<path d="M335 130H425" fill="none" stroke="#575b63" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="435" y="98" width="160" height="115" rx="10" fill="#efefef" stroke="#61748b" stroke-width="2"/>
<text x="515.0" y="161.5" text-anchor="middle" font-size="17" fill="#182333">Coal mill</text>
<path d="M595 155H875" fill="none" stroke="#575b63" stroke-width="4" marker-end="url(#arrow)"/>
<text x="738" y="124" text-anchor="middle" font-size="16" fill="#182333">Pulverized coal + primary air</text>
<text x="76" y="270" text-anchor="middle" font-size="17" fill="#182333">Air inlet</text>
<path d="M130 265H210" fill="none" stroke="#326bc1" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="240" cy="265" r="30" fill="#e8f2ff" stroke="#326bc1" stroke-width="3"/><path d="M227 247L261 265L227 283Z" fill="#326bc1"/>
<text x="240" y="214" text-anchor="middle" font-size="17" fill="#182333">Primary-air fan</text>
<path d="M270 265H515V220" fill="none" stroke="#326bc1" stroke-width="4" marker-end="url(#arrow)"/>
<text x="658" y="257" text-anchor="middle" font-size="17" fill="#326bc1">Drying and transport air</text>
<text x="76" y="389" text-anchor="middle" font-size="17" fill="#182333">Air inlet</text>
<path d="M130 380H210" fill="none" stroke="#326bc1" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="240" cy="380" r="30" fill="#e8f2ff" stroke="#326bc1" stroke-width="3"/><path d="M227 362L261 380L227 398Z" fill="#326bc1"/>
<text x="240" y="329" text-anchor="middle" font-size="17" fill="#182333">Secondary-air fan</text>
<path d="M270 380H875" fill="none" stroke="#326bc1" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M554 366L586 394V366L554 394Z" fill="white" stroke="#326bc1" stroke-width="3"/><path d="M570 379V350M560 350H580" stroke="#326bc1" stroke-width="2"/>
<text x="570" y="426" text-anchor="middle" font-size="16" fill="#182333">Air damper</text>
<text x="755" y="353" text-anchor="middle" font-size="17" fill="#326bc1">Combustion air</text>
<text x="600" y="469" text-anchor="middle" font-size="18" fill="#182333">Total combustion air = primary air + secondary air (+ other combustion-air streams).</text>
<text x="600" y="505" text-anchor="middle" font-size="16" fill="#182333">Use their combined oxygen supply for AIR_NEED and excess air; air heating is omitted.</text>
<text x="600" y="536" text-anchor="middle" font-size="15" fill="#61748b">Conceptual flow diagram; valve trains and auxiliaries are simplified.</text>
